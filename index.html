async function loadQuestions(){for(const file of ['questions.csv','questions-v2.csv'])try{let r=await fetch(file,{cache:'no-store'});if(!r.ok)continue;let a=parseCSV(await r.text());if(a.length>=Q){questions=a;break}}catch{}if(questions.length<Q)msg($('homeStatus'),'Soal kurang dari 50. Pastikan questions.csv atau questions-v2.csv tersedia.','error');else{let cats=[...new Set(questions.map(x=>x.category))].sort();$('category').innerHTML='<option value="semua">🎲 Semua Kategori</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('')}}
function order(cat){let a=cat==='semua'?questions.slice():questions.filter(x=>x.category===cat);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,Q).map(x=>questions.indexOf(x))}
function avatarData(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');let im=new Image(),fr=new FileReader();fr.onload=()=>{im.onload=()=>{let size=220,c=document.createElement('canvas');c.width=c.height=size;let x=c.getContext('2d');let m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;x.drawImage(im,sx,sy,m,m,0,0,size,size);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
function avatarHTML(p,cls='avatar'){return p?.avatar?`<img class="${cls}" src="${p.avatar}" alt="">`:`<div class="${cls} avatar-fallback">${esc((p?.name||'?').slice(0,1).toUpperCase())}</div>`}
function setSound(v){audioOn=v;localStorage.setItem('cc_sound',v?'on':'off');$('soundBtn').textContent=v?'🔊 SOUND ON':'🔇 SOUND OFF'}
let audioCtx=null;function tone(freq,dur,type='sine',vol=.045,delay=0){if(!audioOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}catch{}}
function sfx(kind){if(!audioOn)return;if(kind==='click')tone(520,.08,'square',.035);if(kind==='correct'){tone(660,.11);tone(880,.16,'sine',.05,.09)}if(kind==='wrong'){tone(180,.16,'sawtooth',.035);tone(130,.2,'sawtooth',.03,.12)}if(kind==='timeout'){tone(120,.2,'square',.04);tone(90,.25,'square',.035,.18)}if(kind==='reveal'){tone(440,.12);tone(660,.18,'sine',.04,.1)}if(kind==='next'){tone(500,.08);tone(700,.08,'sine',.035,.08)}if(kind==='victory'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',.05,i*.12))}}
async function authReady(){if(uid)return uid;return await new Promise((res,rej)=>{let done=false;const u=onAuthStateChanged(auth,x=>{if(x){uid=x.uid;done=true;u();res(uid)}});signInAnonymously(auth).catch(e=>{if(!done){u();rej(e)}})})}
function players(g){return Array.from({length:Number(g?.maxPlayers)||2},(_,i)=>'player'+(i+1)).filter(s=>g?.[s])}
function roomRef(){return ref(db,'games/'+roomId)}
async function createGame(){try{await authReady();if(questions.length<Q)return;let max=Number($('maxPlayers').value),cat=$('category').value,ord=order(cat),avatar=$('avatarData').value;if(ord.length<Q){msg($('homeStatus'),'Kategori ini belum memiliki 50 soal.','error');return}let surpriseIndex=10+Math.floor(Math.random()*36);let code='';const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<5;i++)code+=chars[Math.floor(Math.random()*chars.length)];roomId=code;mySlot='player1';let g={gameType:'cerdas-cepat',status:'waiting',hostId:uid,maxPlayers:max,category:cat,questionOrder:ord,questionIndex:0,round:1,roundStartedAt:null,timeLeft:T,surpriseIndex,createdAt:Date.now(),player1:{uid,name:$('name').value.trim()||'Pemain 1',avatar,score:0,correct:0,wrong:0,unanswered:0}};await set(roomRef(),g);await onDisconnect(ref(db,'games/'+roomId+'/'+mySlot)).remove();localStorage.setItem('cc_session',JSON.stringify({roomId,mySlot}));watch();show('lobby')}catch(e){msg($('homeStatus'),'Gagal membuat permainan: '+e.message,'error')}}
async function joinGame(){try{await authReady();let code=$('joinCode').value.trim().toUpperCase();if(code.length!==5){msg($('joinStatus'),'Masukkan kode room 5 karakter.','error');return}roomId=code;let r=roomRef(),snap=await get(r);if(!snap.exists()){msg($('joinStatus'),'Room tidak ditemukan. Periksa kode room.','error');return}let g=snap.val();if(g.gameType!=='cerdas-cepat'){msg($('joinStatus'),'Room bukan permainan Cerdas Cepat.','error');return}if(g.status!=='waiting'){msg($('joinStatus'),'Permainan sudah dimulai.','error');return}let result=await runTransaction(r,d=>{if(!d||d.status!=='waiting')return d;let max=Number(d.maxPlayers)||2;for(let i=1;i<=max;i++){let s='player'+i;if(!d[s]){d[s]={uid,name:$('joinName').value.trim()||'Pemain '+i,avatar:$('joinAvatarData').value,score:0,correct:0,wrong:0,unanswered:0};return d}}return d});if(!result.committed){let d=result.snapshot.val();msg($('joinStatus'),d?.status!=='waiting'?'Permainan sudah dimulai.':`Room sudah penuh (${players(d).length}/${d?.maxPlayers||2}).`,'error');return}let d=result.snapshot.val();mySlot=Object.keys(d).find(s=>d[s]?.uid===uid)||null;if(!mySlot){msg($('joinStatus'),'Gagal menentukan slot pemain.','error');return}await onDisconnect(ref(db,'games/'+roomId+'/'+mySlot)).remove();localStorage.setItem('cc_session',JSON.stringify({roomId,mySlot}));watch();show('lobby')}catch(e){msg($('joinStatus'),'Gagal bergabung: '+e.message,'error')}}
function watch(){if(gameUnsub)gameUnsub();gameUnsub=onValue(roomRef(),s=>{let g=s.val();if(!g){localStorage.removeItem('cc_session');show('home');return}if(g.status==='waiting'){renderLobby(g);show('lobby')}else if(g.status==='playing'){renderGame(g);show('game')}else if(g.status==='finished'){renderResult(g);show('result')}})}
function renderLobby(g){$('roomCode').textContent=roomId;let max=Number(g.maxPlayers)||2;$('slots').style.gridTemplateColumns=`repeat(${Math.min(max,2)},1fr)`;$('slots').innerHTML=Array.from({length:max},(_,i)=>{let p=g['player'+(i+1)];return `<div class="slot ${p?'filled':'empty'}">${p?avatarHTML(p,'slot-avatar'):''}<div><b>${p?esc(p.name):'Slot '+(i+1)}</b><br><span class="muted">${p?'SIAP':'Menunggu'}</span></div></div>`}).join('');let n=players(g).length;$('lobbyStatus').textContent=`${n} / ${max} peserta`;$('start').disabled=uid!==g.hostId||n!==max}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function startGame(){let r=roomRef();await runTransaction(r,g=>{if(!g||g.status!=='waiting'||g.hostId!==uid||players(g).length!==Number(g.maxPlayers))return g;g.status='playing';g.round=1;g.questionIndex=0;g.roundStartedAt={'.sv':'timestamp'};g.timeLeft=T;g.roundAnswers={};return g})}
function renderGame(g){let ps=players(g),idx=Number(g.questionIndex)||0,q=questions[g.questionOrder?.[idx]];if(!q)return;let surprise=idx===Number(g.surpriseIndex);localAnswered=!!g.roundAnswers?.[mySlot];$('qNo').textContent=idx+1;$('catLabel').textContent=q.category;$('question').textContent=q.question;$('questionCard').classList.toggle('surprise-mode',surprise);$('surpriseBadge').classList.toggle('hidden',!surprise);$('answers').innerHTML=q.options.map((o,i)=>`<button class="answer ${localAnswered?'locked':''}" data-i="${i}" ${localAnswered?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('');$('answers').querySelectorAll('.answer').forEach(b=>b.onclick=()=>{sfx('click');submitAnswer(Number(b.dataset.i))});$('answerStatus').textContent=localAnswered?'🔒 Jawaban terkunci. Menunggu peserta lain…':`${ps.length} peserta bermain secara realtime`;$('playersArena').innerHTML=ps.map((s,i)=>{let p=g[s];return `<div class="player-card ${s===mySlot?'me':''}">${avatarHTML(p,'player-avatar')}<div class="player-info"><div class="player-name">${i===0?' ':''}${esc(p.name)}</div><div class="player-label">SKOR</div><div class="player-score">${p.score||0}</div><div class="player-stats">${p.correct||0} benar • ${p.wrong||0} salah • ${p.unanswered||0} kosong</div></div></div>`}).join('');startTimer(g);if(g.feedbackRound===g.round&&g.feedbackUntil)showFeedback(g)}
function startTimer(g){clearInterval(timer);if(g.feedbackRound===g.round&&g.feedbackUntil)return;let st=Number(g.roundStartedAt);if(!st){$('timer').textContent=T;return}let end=st+T*1000,last=-1;const tick=()=>{let left=Math.max(0,Math.ceil((end-now())/1000));$('timer').textContent=left;if(left!==last&&left<=3&&left>0){sfx('click');last=left}if(left<=0){clearInterval(timer);sfx('timeout');timeoutRound(Number(g.round))}};tick();timer=setInterval(tick,250)}
async function submitAnswer(i){if(localAnswered)return;localAnswered=true;let r=roomRef();let out=await runTransaction(r,g=>{if(!g||g.status!=='playing'||g.roundAnswers?.[mySlot])return g;let idx=Number(g.questionIndex),q=questions[g.questionOrder[idx]],correct=q.answer==='ABCD'[i],surprise=idx===Number(g.surpriseIndex),points=surprise?(correct?SP:SW):(correct?PC:PW);g.roundAnswers=g.roundAnswers||{};g.roundAnswers[mySlot]={choice:i,correct,points,at:{'.sv':'timestamp'}};if(players(g).every(s=>g.roundAnswers[s]))g.roundFinalized=true;return g});let g=out.snapshot.val();if(g?.roundFinalized)await finalizeRound();}
async function timeoutRound(round){let r=roomRef();let out=await runTransaction(r,g=>{if(!g||g.status!=='playing'||Number(g.round)!==round||g.roundFinalized)return g;g.roundAnswers=g.roundAnswers||{};for(const s of players(g))if(!g.roundAnswers[s])g.roundAnswers[s]={choice:null,correct:false,points:PU,at:{'.sv':'timestamp'},timeout:true};g.roundFinalized=true;return g});let g=out.snapshot.val();if(g?.roundFinalized)await finalizeRound()}
async function finalizeRound(){let r=roomRef();let out=await runTransaction(r,g=>{if(!g||g.status!=='playing'||!g.roundFinalized||g.feedbackRound===g.round)return g;let ps=players(g);for(const s of ps){let a=g.roundAnswers?.[s];if(!a)continue;g[s].score=(g[s].score||0)+(a.points||0);if(a.timeout)g[s].unanswered=(g[s].unanswered||0)+1;else if(a.correct)g[s].correct=(g[s].correct||0)+1;else g[s].wrong=(g[s].wrong||0)+1}g.feedbackRound=g.round;g.feedbackUntil=now()+2500;return g});let g=out.snapshot.val();if(!out.committed||!g||g.feedbackRound!==g.round)return;scheduleRoundTransition(g)}
function scheduleRoundTransition(g){clearTimeout(feedbackTransitionTimer);if(!g||g.status!=='playing'||g.feedbackRound!==g.round||!g.feedbackUntil)return;const wait=Math.max(100,Number(g.feedbackUntil)-now());feedbackTransitionTimer=setTimeout(async()=>{const snap=await get(roomRef()),cur=snap.val();if(!cur||cur.status!=='playing'||cur.feedbackRound!==cur.round)return;if(Number(cur.questionIndex)>=Q-1){await finishMatch()}else{await nextRound()}},wait+80)}
function showFeedback(g){let key=`${roomId}-${g.round}`;if(lastFeedbackKey===key)return;lastFeedbackKey=key;sfx('reveal');let idx=Number(g.questionIndex)||0,q=questions[g.questionOrder?.[idx]];if(!q)return;let correctIndex='ABCD'.indexOf(q.answer),surprise=idx===Number(g.surpriseIndex);$('feedbackTitle').textContent=surprise?'⚡ PERTANYAAN KEJUTAN':'HASIL JAWABAN';$('feedbackBody').innerHTML=`<div class="correct-answer">${surprise?'<div style="font-weight:1000;color:#d97706;margin-bottom:5px">NILAI KHUSUS: BENAR +30 • SALAH -30 • KOSONG 0</div>':''}JAWABAN BENAR <strong>${q.answer}. ${esc(q.options[correctIndex])}</strong></div><div class="feedback-grid">${players(g).map(s=>{let p=g[s],a=g.roundAnswers?.[s];let label=a?.choice==null?'—':`${'ABCD'[a.choice]}. ${esc(q.options[a.choice])}`;let state=a?.timeout?'TIMEOUT':a?.correct?'BENAR':'SALAH';let cls=a?.timeout?'neutral':a?.correct?'ok':'bad';return `<div class="mini-player">${avatarHTML(p,'mini-avatar')}<div><b>${esc(p.name)}</b><div>${label}</div><span class="${cls}">${state} ${a?.points>0?`+${a.points}`:a?.points<0?`${a.points}`:'0'}</span></div></div>`}).join('')}</div>`;$('feedbackCountdown').textContent='Soal berikutnya…';$('feedback').classList.remove('hidden');scheduleRoundTransition(g)}
async function nextRound(){clearTimeout(feedbackTransitionTimer);lastFeedbackKey=null;$('feedback').classList.add('hidden');sfx('next');await runTransaction(roomRef(),g=>{if(!g||g.status!=='playing'||!g.feedbackUntil)return g;g.questionIndex++;g.round++;g.roundStartedAt={'.sv':'timestamp'};g.timeLeft=T;g.roundAnswers={};g.roundFinalized=false;g.feedbackUntil=null;g.feedbackRound=null;return g})}
async function finishMatch(){clearTimeout(feedbackTransitionTimer);let out=await runTransaction(roomRef(),g=>{if(!g||g.status!=='playing'||Number(g.questionIndex)!==Q-1)return g;g.status='finished';g.finishedAt={'.sv':'timestamp'};let ps=players(g);let max=Math.max(...ps.map(s=>Number(g[s].score)||0));g.winners=ps.filter(s=>(Number(g[s].score)||0)===max);return g});if(out.committed){$('feedback').classList.add('hidden');sfx('victory');await writeHistory(out.snapshot.val())}}
async function writeHistory(g){let ps=players(g),key=roomId;let hist={roomId,finishedAt:g.finishedAt||Date.now(),category:g.category,players:ps.map(s=>({slot:s,...g[s]})),winners:g.winners||[]};await set(ref(db,'cerdasCepatHistory/'+key),hist)}
function renderResult(g){clearInterval(timer);let ps=players(g).sort((a,b)=>(g[b].score||0)-(g[a].score||0));$('results').innerHTML=`<div class="muted" style="text-align:center;margin-bottom:10px">${ps.length} peserta • 50 soal • ${esc(g.category)}</div>`+ps.map((s,i)=>{let p=g[s];return `<div class="resultrow"><b>${i+1}</b><div><strong>${esc(p.name)}</strong><br><span class="muted">${p.correct||0} benar • ${p.wrong||0} salah • ${p.unanswered||0} kosong</span></div><strong>${p.score||0} poin</strong></div>`}).join('')+`<div class="status" style="margin-top:15px">🏆 Pemenang: ${ps.filter(s=>(g[s].score||0)===(g[ps[0]].score||0)).map(s=>esc(g[s].name)).join(', ')}</div>`}
async function showHistory(){show('historyScreen');$('historyList').innerHTML='Memuat…';try{let snap=await get(query(ref(db,'cerdasCepatHistory'),orderByChild('finishedAt'),limitToLast(20)));let v=snap.val()||{};let arr=Object.values(v).reverse();$('historyList').innerHTML=arr.length?arr.map(h=>{let ps=(h.players||[]).sort((a,b)=>(b.score||0)-(a.score||0));return `<div class="history-item"><b>🧠 CERDAS CEPAT</b> • ${ps.length} peserta<br><span class="muted">${esc(h.category)} • Room ${esc(h.roomId)}</span><div>${ps.map((p,i)=>`${i+1}. ${esc(p.name)} — <b>${p.score||0}</b>`).join('<br>')}</div></div>`}).join(''):'Belum ada riwayat.'}catch(e){$('historyList').textContent='Gagal memuat riwayat: '+e.message}}
const THEME_KEY='cc_theme';
function applyTheme(theme){const allowed=['light','dark'];if(!allowed.includes(theme))theme='light';document.body.classList.remove('theme-light','theme-dark');document.body.classList.add('theme-'+theme);localStorage.setItem(THEME_KEY,theme);document.querySelectorAll('.theme-choice').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme))}
const savedTheme=localStorage.getItem(THEME_KEY)||'light';applyTheme(savedTheme);
const themeToggle=$('themeToggle'),themeMenu=$('themeMenu');
function refreshThemeChoices(theme){document.querySelectorAll('.theme-choice').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme))}
refreshThemeChoices(savedTheme);
function toggleThemeMenu(force){const open=typeof force==='boolean'?force:!themeMenu.classList.contains('open');themeMenu.classList.toggle('open',open);themeToggle?.setAttribute('aria-expanded',String(open));themeMenu?.setAttribute('aria-hidden',String(!open))}
themeToggle?.addEventListener('click',e=>{e.stopPropagation();toggleThemeMenu()});
document.querySelectorAll('.theme-choice').forEach(b=>b.addEventListener('click',()=>{applyTheme(b.dataset.theme);refreshThemeChoices(b.dataset.theme);toggleThemeMenu(false)}));
document.addEventListener('click',e=>{if(!e.target.closest('#themeSwitcher'))toggleThemeMenu(false)});
$('create').onclick=createGame;$('joinBtn').onclick=joinGame;$('avatarFile').onchange=async e=>{$('avatarData').value=await avatarData(e.target.files[0]);$('avatarPreview').innerHTML=avatarHTML({avatar:$('avatarData').value,name:$('name').value},'preview-avatar')};$('joinAvatarFile').onchange=async e=>{$('joinAvatarData').value=await avatarData(e.target.files[0]);$('joinAvatarPreview').innerHTML=avatarHTML({avatar:$('joinAvatarData').value,name:$('joinName').value},'preview-avatar')};$('soundBtn').onclick=()=>setSound(!audioOn);$('gotoJoin').onclick=()=>show('join');$('backHome').onclick=()=>show('home');$('history').onclick=showHistory;$('historyHome').onclick=()=>show('home');$('resultHome').onclick=()=>show('home');$('start').onclick=startGame;$('leave').onclick=async()=>{if(roomId&&mySlot)await remove(ref(db,'games/'+roomId+'/'+mySlot));localStorage.removeItem('cc_session');show('home')};$('copy').onclick=()=>navigator.clipboard?.writeText(roomId);
$('name').addEventListener('input',e=>$('joinName').value=e.target.value);setSound(audioOn);loadQuestions();authReady().catch(()=>{});
</script></body></html>
