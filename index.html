<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cerdas Cepat — Quiz Real-Time</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--ink:#f7f9ff;--muted:#9ca9c4;--accent:#ffd54a;--ok:#36d399;--bad:#ff657a;--line:#2a3958;--shadow:0 20px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#243b67 0,#0b1020 48%);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center}.screen{display:none;width:min(1120px,100%)}.screen.active{display:block}.panel{background:rgba(18,26,45,.94);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px}.home{text-align:center;max-width:760px;margin:auto}.logo{font-size:clamp(42px,8vw,86px);font-weight:1000;letter-spacing:-.06em;line-height:.9}.tag{margin:12px 0 28px;color:var(--muted);font-weight:800;letter-spacing:.08em}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:7px;text-align:left}.field label{font-size:12px;color:var(--muted);font-weight:900}.field input,.field select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#0d1527;color:var(--ink);outline:none}.btn{padding:14px 18px;border-radius:15px;font-weight:1000;background:var(--accent);color:#171717;transition:.15s transform}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:#22304d;color:var(--ink)}.btn.danger{background:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.actions{display:grid;gap:10px;margin-top:16px}.note{color:var(--muted);font-size:12px;line-height:1.5}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:24px;font-weight:1000}.roomcode{font-weight:1000;letter-spacing:.14em}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player{background:#0d1527;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#253758;font-size:30px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.pname{font-weight:1000;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.status{font-size:11px;color:var(--muted);margin-top:3px}.game-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:16px}.progress{font-size:14px;font-weight:1000}.timer{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:6px solid var(--accent);font-size:25px;font-weight:1000}.question{background:linear-gradient(145deg,#182642,#101a2d);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,42px);text-align:center}.qtext{font-size:clamp(22px,3.4vw,40px);font-weight:1000;line-height:1.18;margin:0 auto 24px;max-width:900px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:900px;margin:auto}.answer{min-height:72px;border:1px solid var(--line);background:#0b1426;color:var(--ink);border-radius:17px;padding:14px 16px;text-align:left;font-weight:900;transition:.15s}.answer:hover:not(:disabled){border-color:var(--accent);background:#15233d}.answer.locked{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,213,74,.15) inset}.answer.correct{border-color:var(--ok);background:rgba(54,211,153,.12)}.answer.wrong{border-color:var(--bad);background:rgba(255,101,122,.12)}.answer:disabled{cursor:default}.mini-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.scorecard{background:#0d1527;border:1px solid var(--line);border-radius:15px;padding:10px}.scoreline{display:flex;justify-content:space-between;gap:6px;font-weight:1000}.score{font-size:18px}.scorecard .tiny{font-size:10px;color:var(--muted);margin-top:4px}.feedback{margin-top:14px;background:#101a2d;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}.feedback h2{margin:0 0 8px}.result-title{text-align:center;font-size:clamp(30px,6vw,58px);font-weight:1000}.ranking{display:grid;gap:10px;margin-top:20px}.rank{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;background:#0d1527;border:1px solid var(--line);border-radius:18px;padding:12px}.rankno{font-size:25px;font-weight:1000;text-align:center}.rankname{font-weight:1000}.stats{font-size:11px;color:var(--muted);margin-top:3px}.rankscore{font-size:23px;font-weight:1000}.history-list{display:grid;gap:10px;margin-top:14px}.history{background:#0d1527;border:1px solid var(--line);border-radius:18px;padding:14px}.history-head{display:flex;justify-content:space-between;gap:10px;font-weight:1000}.history-players{margin-top:8px;color:var(--muted);font-size:12px}.history-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}.history-row:last-child{border-bottom:0}.error{color:#ff9baa;font-size:12px;margin-top:10px;min-height:18px}.hidden{display:none!important}@media(max-width:720px){.app{padding:10px}.panel{padding:16px;border-radius:20px}.two,.answers{grid-template-columns:1fr}.players,.four{grid-template-columns:repeat(2,1fr)}.game-head{grid-template-columns:1fr auto}.game-head .roomcode{grid-column:1/-1;grid-row:2}.mini-board{grid-template-columns:repeat(2,1fr)}.answer{min-height:62px}.qtext{font-size:clamp(20px,6vw,30px)}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active"><div class="panel home"><div class="logo">🧠 CERDAS<br>CEPAT</div><div class="tag">CEPAT MENJAWAB. TEPAT MENANG.</div><div class="grid two"><div class="field"><label>NAMA PEMAIN</label><input id="name" maxlength="18" placeholder="Nama kamu"></div><div class="field"><label>JUMLAH PESERTA</label><select id="maxPlayers"><option value="2">2 Peserta</option><option value="3">3 Peserta</option><option value="4" selected>4 Peserta</option></select></div><div class="field"><label>KATEGORI SOAL</label><select id="category"><option value="semua">Semua kategori</option></select></div><div class="field"><label>AVATAR (OPSIONAL)</label><input id="avatarFile" type="file" accept="image/*"></div></div><div class="actions"><button class="btn" id="createBtn">🎮 BUAT PERMAINAN</button><button class="btn secondary" id="joinBtn">🔗 GABUNG PERMAINAN</button><button class="btn secondary" id="historyBtn">📜 RIWAYAT MATCH</button></div><div id="homeError" class="error"></div><p class="note">50 soal acak • benar +10 • salah −10 • tidak menjawab 0 • jawaban terkunci setelah dipilih.</p></div></section>
<section id="join" class="screen"><div class="panel" style="max-width:620px;margin:auto"><div class="topbar"><div class="brand">🔗 Gabung Permainan</div><button class="btn secondary" id="backJoin">Kembali</button></div><div class="field"><label>KODE ROOM</label><input id="roomInput" maxlength="8" placeholder="ABCDE" style="text-transform:uppercase;text-align:center;font-size:28px;font-weight:1000;letter-spacing:.15em"></div><div class="actions"><button class="btn" id="doJoin">GABUNG</button></div><div id="joinError" class="error"></div></div></section>
<section id="lobby" class="screen"><div class="panel"><div class="topbar"><div><div class="brand">🧠 CERDAS CEPAT</div><div class="note">Room: <span id="lobbyRoom" class="roomcode"></span></div></div><button class="btn secondary" id="leaveLobby">Keluar</button></div><div id="lobbyPlayers" class="players"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap"><div class="note" id="lobbyInfo"></div><button class="btn" id="startBtn">⚡ MULAI MATCH</button></div><div id="lobbyError" class="error"></div></div></section>
<section id="game" class="screen"><div class="panel"><div class="game-head"><div class="progress" id="questionNo">SOAL 1 / 50</div><div class="timer" id="timer">15</div><div class="roomcode" id="gameRoom"></div></div><div class="question"><p id="questionText" class="qtext">Memuat soal...</p><div id="answers" class="answers"></div></div><div id="miniBoard" class="mini-board"></div><div id="feedback" class="feedback hidden"></div></div></section>
<section id="result" class="screen"><div class="panel"><div class="result-title">🏆 HASIL AKHIR</div><div id="ranking" class="ranking"></div><div class="actions"><button class="btn" id="playAgain">🏠 KEMBALI KE MENU</button><button class="btn secondary" id="resultHistory">📜 LIHAT RIWAYAT</button></div></div></section>
<section id="historyScreen" class="screen"><div class="panel"><div class="topbar"><div class="brand">📜 Riwayat Cerdas Cepat</div><button class="btn secondary" id="backHistory">Kembali</button></div><div id="historyList" class="history-list"></div><div id="historyError" class="error"></div></div></section>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect, remove, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

// === FIREBASE CONFIG: DIPERTAHANKAN DARI mantapdah.html ===
const firebaseConfig={apiKey:"AIzaSyD5rz32REtSttxYFXEamc57StcYYOlTYuY",authDomain:"tug-of-war-game-fd28c.firebaseapp.com",databaseURL:"https://tug-of-war-game-fd28c-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tug-of-war-game-fd28c",storageBucket:"tug-of-war-game-fd28c.firebasestorage.app",messagingSenderId:"631269625566",appId:"1:631269625566:web:951f261c55cf0814ddbc4f"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app); let serverTimeOffset=0;
onValue(ref(db,".info/serverTimeOffset"),s=>{const v=Number(s.val());if(Number.isFinite(v))serverTimeOffset=v});
const nowServer=()=>Date.now()+serverTimeOffset; const $=id=>document.getElementById(id);
const MATCH_QUESTIONS=50,TIME_PER_QUESTION=15,FEEDBACK_MS=2200,POINT_CORRECT=10,POINT_WRONG=-10,POINT_UNANSWERED=0;
const DEFAULT_AVATAR="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" rx="64" fill="#253758"/><text x="64" y="82" text-anchor="middle" font-size="62">👤</text></svg>`);
let uid=null,roomId=null,mySlot=null,roomUnsub=null,questions=[],questionsReady=false,avatar=DEFAULT_AVATAR,timer=null,lastRound=-1,localAnswered=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function err(id,msg){$(id).textContent=msg||''}
function roomCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCSV(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='
'||ch==='')&&!quoted){if(ch===''&&next==='
')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))rows.push(row);row=[]}else cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()))rows.push(row)}if(rows.length<2)throw Error('CSV kosong.');const h=rows[0].map(x=>x.trim().toLowerCase());const need=['category','question','option_a','option_b','option_c','option_d','answer'];const ix=Object.fromEntries(need.map(k=>[k,h.indexOf(k)]));const miss=need.filter(k=>ix[k]<0);if(miss.length)throw Error('Kolom CSV kurang: '+miss.join(', '));return rows.slice(1).map(r=>{const a=[r[ix.option_a],r[ix.option_b],r[ix.option_c],r[ix.option_d]].map(x=>(x||'').trim());let ans=(r[ix.answer]||'').trim().toUpperCase();let c=/^[ABCD]$/.test(ans)?ans.charCodeAt(0)-65:parseInt(ans,10);if(!Number.isInteger(c)||c<0||c>3)return null;return{q:(r[ix.question]||'').trim(),a,c,cat:(r[ix.category]||'umum').trim()}}).filter(x=>x&&x.q)}
async function loadQuestions(){try{const r=await fetch('questions.csv',{cache:'no-store'});if(!r.ok)throw Error('questions.csv tidak ditemukan');questions=parseCSV(await r.text());if(questions.length<50)throw Error(`Soal tersedia ${questions.length}; minimal 50 diperlukan.`);questionsReady=true;const cats=[...new Set(questions.map(q=>q.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$('category').innerHTML='<option value="semua">Semua kategori</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}catch(e){questionsReady=false;err('homeError',e.message)}}
function poolFor(cat){const pool=cat==='semua'?questions:questions.filter(q=>q.cat===cat);if(pool.length<50)throw Error(`Kategori "${cat}" hanya memiliki ${pool.length} soal; minimal 50 diperlukan.`);return pool}
function randomOrder(cat){const arr=poolFor(cat).map((_,i)=>i);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.slice(0,50)}
function playersOf(g){return ['player1','player2','player3','player4'].filter(s=>g&&g[s]&&g[s].uid)}
function avatarHTML(p){return p.avatar?`<div class="avatar"><img src="${p.avatar}" alt=""></div>`:'<div class="avatar">👤</div>'}
function saveSession(){localStorage.setItem('cc_session',JSON.stringify({roomId,mySlot}))}
function clearSession(){localStorage.removeItem('cc_session')}
async function createGame(){if(!uid)return;err('homeError','');if(!questionsReady)return err('homeError','Soal belum siap. Pastikan questions.csv tersedia.');const name=$('name').value.trim();if(!name)return err('homeError','Masukkan nama pemain.');const maxPlayers=Number($('maxPlayers').value),cat=$('category').value,order=randomOrder(cat);roomId=roomCode();mySlot='player1';const game={gameType:'cerdas-cepat',status:'waiting',hostId:uid,maxPlayers,category:cat,questionOrder:order,questionIndex:0,round:0,playersCount:1,createdAt:serverTimestamp(),player1:{uid,name,avatar,score:0,correct:0,wrong:0,unanswered:0,ready:true,joinedAt:serverTimestamp()}};try{await set(ref(db,'games/'+roomId),game);await onDisconnect(ref(db,`games/${roomId}/${mySlot}`)).remove();saveSession();listenRoom();show('lobby')}catch(e){err('homeError',e.message);roomId=null;mySlot=null}}
async function joinGame(){const code=$('roomInput').value.trim().toUpperCase();if(!code)return err('joinError','Masukkan kode room.');const name=$('name').value.trim();if(!name)return err('joinError','Kembali ke menu dan masukkan nama pemain.');if(!questionsReady)return err('joinError','Soal belum siap.');const r=ref(db,'games/'+code);try{const snap=await get(r);if(!snap.exists())throw Error('Room tidak ditemukan.');const g=snap.val();if(g.gameType!=='cerdas-cepat')throw Error('Room ini bukan Cerdas Cepat.');if(g.status!=='waiting')throw Error('Match sudah dimulai.');const slots=['player1','player2','player3','player4'];mySlot=slots.find(s=>!g[s]);if(!mySlot)throw Error('Room sudah penuh.');if(slots.indexOf(mySlot)>=g.maxPlayers)throw Error('Kapasitas room sudah penuh.');roomId=code;await update(ref(db,`games/${roomId}/${mySlot}`),{uid,name,avatar,score:0,correct:0,wrong:0,unanswered:0,ready:true,joinedAt:serverTimestamp()});await update(ref(db,`games/${roomId}`),{playersCount:playersOf({...g,[mySlot]:{uid}}).length+0});await onDisconnect(ref(db,`games/${roomId}/${mySlot}`)).remove();saveSession();listenRoom();show('lobby')}catch(e){err('joinError',e.message)}}
function listenRoom(){if(roomUnsub)roomUnsub();if(!roomId)return;roomUnsub=onValue(ref(db,'games/'+roomId),snap=>{if(!snap.exists()){clearSession();stopTimer();show('home');return}const g=snap.val();if(g.gameType!=='cerdas-cepat')return;if(g.status==='waiting')renderLobby(g);else if(g.status==='playing')renderGame(g);else if(g.status==='finished')renderResult(g)},e=>{console.error(e);err('lobbyError','Koneksi room bermasalah.')})}
function renderLobby(g){show('lobby');$('lobbyRoom').textContent=roomId;const ps=playersOf(g);$('lobbyPlayers').innerHTML=['player1','player2','player3','player4'].map((s,i)=>{const p=g[s];if(!p)return `<div class="player"><div class="avatar">＋</div><div class="pname">Menunggu</div><div class="status">Slot ${i+1}</div></div>`;return `<div class="player">${avatarHTML(p)}<div class="pname">${esc(p.name)}${p.uid===g.hostId?' 👑':''}</div><div class="status">${p.ready?'SIAP':'BELUM SIAP'}</div></div>`}).join('');$('lobbyInfo').textContent=`${ps.length} / ${g.maxPlayers} peserta • ${g.category==='semua'?'Semua kategori':g.category} • 50 soal`;$('startBtn').classList.toggle('hidden',uid!==g.hostId);$('startBtn').disabled=ps.length<2||ps.length<g.maxPlayers}
async function startGame(){const snap=await get(ref(db,'games/'+roomId));if(!snap.exists())return;const g=snap.val();if(g.hostId!==uid||g.status!=='waiting')return;const ps=playersOf(g);if(ps.length<2||ps.length!==g.maxPlayers)return err('lobbyError',`Butuh ${g.maxPlayers} peserta.`);const startedAt=nowServer();await update(ref(db,'games/'+roomId),{status:'playing',round:1,questionIndex:0,roundStartedAt:startedAt,roundDeadline:startedAt+TIME_PER_QUESTION*1000,roundAnswers:null,feedbackUntil:null,startedAt:serverTimestamp()});}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function renderGame(g){show('game');$('gameRoom').textContent=roomId;$('questionNo').textContent=`SOAL ${Number(g.questionIndex)+1} / ${MATCH_QUESTIONS}`;const qIndex=g.questionOrder[g.questionIndex];const q=poolFor(g.category)[qIndex];if(!q)return;const answers=$('answers');const ra=g.roundAnswers||{};const mine=ra[mySlot];localAnswered=!!mine;$('questionText').textContent=q.q;answers.innerHTML=q.a.map((a,i)=>`<button class="answer ${mine&&mine.choice===i?'locked':''}" data-i="${i}" ${mine?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(a)}</button>`).join('');answers.querySelectorAll('button').forEach(b=>b.onclick=()=>submitAnswer(g,Number(b.dataset.i)));renderBoard(g);if(g.feedbackUntil&&nowServer()<Number(g.feedbackUntil))renderFeedback(g,q);else $('feedback').classList.add('hidden');runTimer(g)}
function runTimer(g){stopTimer();const tick=()=>{const left=Math.max(0,Math.ceil((Number(g.roundDeadline||0)-nowServer())/1000));$('timer').textContent=left;if(left<=0){stopTimer();if(g.status==='playing')finalizeRound(g)}};tick();timer=setInterval(tick,200)}
function renderBoard(g){const ps=playersOf(g);$('miniBoard').innerHTML=ps.map((s,i)=>{const p=g[s],a=(g.roundAnswers||{})[s];return `<div class="scorecard"><div class="scoreline"><span>${esc(p.name)}</span><span class="score">${Number(p.score||0)}</span></div><div class="tiny">${a?'🔒 SUDAH MENJAWAB':'⏳ MENJAWAB...'}</div></div>`}).join('')}
async function submitAnswer(g,choice){if(localAnswered||g.status!=='playing')return;const q=poolFor(g.category)[g.questionOrder[g.questionIndex]];const slot=mySlot;if(!q)return;const answerRef=ref(db,`games/${roomId}/roundAnswers/${slot}`);const res=await runTransaction(answerRef,current=>{if(current!==null)return current;const correct=choice===q.c;return{choice,correct,points:correct?POINT_CORRECT:POINT_WRONG,answeredAt:nowServer()}});if(res.committed)localAnswered=true;}
async function finalizeRound(g){const r=ref(db,'games/'+roomId);const snap=await get(r);if(!snap.exists())return;const cur=snap.val();if(cur.status!=='playing')return;const ps=playersOf(cur),answers=cur.roundAnswers||{};const deadline=Number(cur.roundDeadline||0);const allAnswered=ps.every(s=>answers[s]);if(nowServer()<deadline&&!allAnswered)return;const updates={};ps.forEach(s=>{if(!answers[s])updates[`roundAnswers/${s}`]={choice:null,correct:false,points:POINT_UNANSWERED,unanswered:true,answeredAt:null}});if(Object.keys(updates).length)await update(r,updates);const snap2=await get(r);const g2=snap2.val();const a2=g2.roundAnswers||{};const scoreUpdates={};ps.forEach(s=>{const p=g2[s]||{};const a=a2[s]||{points:0};scoreUpdates[`${s}/score`]=Number(p.score||0)+Number(a.points||0);scoreUpdates[`${s}/correct`]=Number(p.correct||0)+(a.correct?1:0);scoreUpdates[`${s}/wrong`]=Number(p.wrong||0)+(!a.unanswered&&!a.correct?1:0);scoreUpdates[`${s}/unanswered`]=Number(p.unanswered||0)+(a.unanswered?1:0)});const last=Number(g2.questionIndex)>=MATCH_QUESTIONS-1;scoreUpdates.feedbackUntil=nowServer()+FEEDBACK_MS;scoreUpdates.status=last?'finished':'playing';if(last)scoreUpdates.finishedAt=serverTimestamp();await update(r,scoreUpdates);if(last){await writeHistory(g2,scoreUpdates);return}setTimeout(async()=>{const s=await get(r);if(!s.exists())return;const x=s.val();if(x.status!=='playing'||Number(x.questionIndex)!==Number(g2.questionIndex))return;const ni=Number(x.questionIndex)+1,started=nowServer();await update(r,{questionIndex:ni,round:Number(x.round||0)+1,roundStartedAt:started,roundDeadline:started+TIME_PER_QUESTION*1000,roundAnswers:null,feedbackUntil:null})},FEEDBACK_MS)}
function renderFeedback(g,q){const f=$('feedback');const answers=g.roundAnswers||{};f.classList.remove('hidden');const rows=playersOf(g).map(s=>{const p=g[s],a=answers[s]||{};return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0"><span>${esc(p.name)}</span><b>${a.unanswered?'⏱️ 0':a.correct?'✅ +10':'❌ −10'}</b></div>`}).join('');f.innerHTML=`<h2>Jawaban benar: ${esc(q.a[q.c])}</h2>${rows}`}
function renderResult(g){show('result');stopTimer();const ps=playersOf(g).map(s=>({slot:s,...g[s]})).sort((a,b)=>Number(b.score||0)-Number(a.score||0));const top=Number(ps[0]?.score||0);const tied=ps.filter(p=>Number(p.score||0)===top).length>1;$('ranking').innerHTML=`<div style="text-align:center;color:var(--muted);font-weight:800">${tied?'HASIL SERI':'PEMENANG: '+esc(ps[0]?.name||'')}</div>`+ps.map((p,i)=>`<div class="rank"><div class="rankno">${['🥇','🥈','🥉','4️⃣'][i]||i+1}</div><div><div class="rankname">${esc(p.name)}</div><div class="stats">✅ ${p.correct||0} benar • ❌ ${p.wrong||0} salah • ⏱️ ${p.unanswered||0} kosong</div></div><div class="rankscore">${Number(p.score||0)}</div></div>`).join('')}
async function writeHistory(g,finalUpdates){const ps=playersOf(g).map(s=>({slot:s,...g[s],score:Number(g[s].score||0)+Number((finalUpdates||{})[`${s}/score`]||0)-Number(g[s].score||0)}));const scores={};ps.forEach(p=>scores[p.slot]={name:p.name,avatar:p.avatar||'',score:p.score,correct:Number(p.correct||0)+Number((finalUpdates||{})[`${p.slot}/correct`]||0)-Number(g[p.slot].correct||0),wrong:Number(p.wrong||0)+Number((finalUpdates||{})[`${p.slot}/wrong`]||0)-Number(g[p.slot].wrong||0),unanswered:Number(p.unanswered||0)+Number((finalUpdates||{})[`${p.slot}/unanswered`]||0)-Number(g[p.slot].unanswered||0)});const hist={gameType:'cerdas-cepat',roomId,category:g.category,maxPlayers:g.maxPlayers,questionCount:MATCH_QUESTIONS,players:scores,finishedAt:serverTimestamp()};await set(ref(db,`cerdasCepatHistory/${roomId}`),hist)}
async function loadHistory(){show('historyScreen');$('historyList').textContent='Memuat...';try{const snap=await get(ref(db,'cerdasCepatHistory'));if(!snap.exists()){ $('historyList').textContent='Belum ada riwayat Cerdas Cepat.';return}const vals=Object.values(snap.val()).sort((a,b)=>Number(b.finishedAt||0)-Number(a.finishedAt||0)).slice(0,50);$('historyList').innerHTML=vals.map(h=>{const ps=Object.values(h.players||{}).sort((a,b)=>Number(b.score||0)-Number(a.score||0));return `<div class="history"><div class="history-head"><span>🧠 CERDAS CEPAT • ${h.questionCount||50} SOAL</span><span>${esc(h.category||'semua')}</span></div><div class="history-players">${ps.map((p,i)=>`<div class="history-row"><span>${['🥇','🥈','🥉','4️⃣'][i]||i+1} ${esc(p.name)}</span><b>${Number(p.score||0)}</b></div>`).join('')}</div></div>`}).join('')}catch(e){err('historyError',e.message)}}
function leave(){if(roomUnsub){roomUnsub();roomUnsub=null}stopTimer();clearSession();roomId=null;mySlot=null;show('home')}
$('avatarFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{avatar=r.result};r.readAsDataURL(f)};
$('createBtn').onclick=createGame;$('joinBtn').onclick=()=>{err('joinError','');show('join')};$('doJoin').onclick=joinGame;$('backJoin').onclick=()=>show('home');$('startBtn').onclick=startGame;$('leaveLobby').onclick=leave;$('playAgain').onclick=leave;$('resultHistory').onclick=loadHistory;$('historyBtn').onclick=loadHistory;$('backHistory').onclick=()=>show('home');
onAuthStateChanged(auth,u=>{uid=u?.uid||null});signInAnonymously(auth).catch(e=>err('homeError','Firebase Auth gagal: '+e.message));loadQuestions();
// Reconnect: kembali ke room jika masih hidup.
try{const ss=JSON.parse(localStorage.getItem('cc_session')||'null');if(ss?.roomId&&ss?.mySlot){roomId=ss.roomId;mySlot=ss.mySlot;get(ref(db,'games/'+roomId)).then(s=>{if(s.exists()&&s.val().gameType==='cerdas-cepat'){listenRoom();show(s.val().status==='waiting'?'lobby':s.val().status==='playing'?'game':'result')}else clearSession()})}}catch{}
</script>
